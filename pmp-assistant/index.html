<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMP 项目管理助手 - 风险清单生成 + 考点速记</title>
<style>
  :root {
    --primary: #4338ca;
    --primary-light: #6366f1;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-light: #64748b;
    --amber: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  .container { max-width: 920px; margin: 0 auto; padding: 24px 16px 56px; }
  header { text-align: center; padding: 26px 0 18px; }
  header h1 { font-size: 26px; font-weight: 700; }
  header h1 span { color: var(--primary); }
  header p { color: var(--text-light); font-size: 14px; margin-top: 6px; }
  .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
  .tab { padding: 10px 26px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--text-light); }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 18px; }
  .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--primary); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .selects { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 8px 16px; border: 1px solid var(--border); border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--text-light); background: #fff; transition: all 0.15s; }
  .chip:hover { border-color: var(--primary-light); }
  .chip.sel { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 500; }
  .btn { display: inline-block; padding: 11px 28px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #3730a3; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .risk-group { margin-bottom: 16px; }
  .risk-group h3 { font-size: 14px; font-weight: 700; color: var(--primary-light); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .risk-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--border); align-items: flex-start; }
  .risk-item input[type=checkbox] { margin-top: 4px; flex-shrink: 0; }
  .risk-item .rt { font-size: 13.5px; font-weight: 600; }
  .risk-item .rm { font-size: 12.5px; color: var(--text-light); margin-top: 2px; }
  .lvl { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fff; margin-left: 6px; vertical-align: 1px; }
  .lvl.high { background: #dc2626; }
  .lvl.mid { background: #d97706; }
  .lvl.low { background: #0d9488; }
  .toolbar { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn-outline { padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 13.5px; cursor: pointer; color: var(--text); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  /* 抽认卡 */
  .flash-area { max-width: 560px; margin: 0 auto; text-align: center; }
  .flash-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; min-height: 210px; padding: 28px 24px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 2px 8px rgba(67,56,202,0.08); transition: transform 0.15s; }
  .flash-card:hover { transform: translateY(-2px); }
  .flash-card .cat { font-size: 12px; font-weight: 700; color: var(--primary-light); letter-spacing: 1px; margin-bottom: 12px; }
  .flash-card .qside { font-size: 17px; font-weight: 600; }
  .flash-card .aside { font-size: 14px; color: var(--text-light); margin-top: 14px; text-align: left; border-top: 1px dashed var(--border); padding-top: 14px; }
  .flash-card .tap { font-size: 12px; color: var(--text-light); margin-top: 16px; }
  .flash-nav { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .flash-count { font-size: 12px; color: var(--text-light); margin-top: 10px; }
  .empty-tip { color: var(--text-light); font-size: 13px; text-align: center; padding: 20px 0; }
  footer { text-align: center; color: var(--text-light); font-size: 12px; padding: 20px 0; }
  .hidden { display: none; }
  select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>PMP <span>项目管理助手</span></h1>
    <p>按项目类型和阶段生成风险检查清单，配合高频考点速记卡，考前与开项目前都用得上</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="risk">🎯 风险清单生成</div>
    <div class="tab" data-tab="flash">📚 考点速记卡</div>
  </div>

  <!-- 风险清单 -->
  <div id="tab-risk">
    <div class="card">
      <h2>选择项目类型</h2>
      <div class="selects" id="typeBox">
        <div class="chip sel" data-v="software">软件 / IT</div>
        <div class="chip" data-v="rpa">RPA / 自动化</div>
        <div class="chip" data-v="infra">工程 / 基建</div>
        <div class="chip" data-v="consult">咨询 / 实施</div>
      </div>
      <h2 style="margin-top:18px;">选择当前阶段</h2>
      <div class="selects" id="phaseBox">
        <div class="chip sel" data-v="init">启动</div>
        <div class="chip" data-v="plan">规划</div>
        <div class="chip" data-v="exec">执行</div>
        <div class="chip" data-v="monitor">监控</div>
        <div class="chip" data-v="close">收尾</div>
      </div>
      <div class="toolbar" style="margin-top:18px;">
        <button class="btn" id="btnGen">生成风险清单</button>
      </div>
    </div>
    <div class="card hidden" id="riskResult">
      <h2>风险检查清单 <span style="font-size:13px;color:var(--text-light);font-weight:400;" id="riskMeta"></span></h2>
      <div id="riskBody"></div>
      <div class="toolbar">
        <button class="btn-outline" id="btnCopyRisk">复制清单文本</button>
        <span style="font-size:12px;color:var(--text-light);align-self:center;" id="checkStats"></span>
      </div>
    </div>
  </div>

  <!-- 考点速记 -->
  <div id="tab-flash" class="hidden">
    <div class="card">
      <h2>选择考点类别</h2>
      <div class="selects" id="catBox">
        <div class="chip sel" data-v="all">全部</div>
        <div class="chip" data-v="framework">五大过程组</div>
        <div class="chip" data-v="risk">风险应对</div>
        <div class="chip" data-v="evm">挣值管理</div>
        <div class="chip" data-v="procure">合同类型</div>
        <div class="chip" data-v="soft">软技能</div>
      </div>
    </div>
    <div class="flash-area">
      <div class="flash-card" id="flashCard">
        <div class="cat" id="fCat"></div>
        <div class="qside" id="fQ"></div>
        <div class="aside hidden" id="fA"></div>
        <div class="tap" id="fTap">点击卡片查看答案</div>
      </div>
      <div class="flash-nav">
        <button class="btn-outline" id="fPrev">← 上一张</button>
        <button class="btn-outline" id="fShuffle">🔀 打乱</button>
        <button class="btn-outline" id="fNext">下一张 →</button>
      </div>
      <div class="flash-count" id="fCount"></div>
    </div>
  </div>

  <footer>PMP 项目管理助手 · 风险清单基于 PMBOK 常见风险分类整理 · 备考辅助工具，不替代官方教材</footer>
</div>

<script>
(function () {
  // ---------- Tab 切换 ----------
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      tabs.forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      document.getElementById('tab-risk').classList.toggle('hidden', t.getAttribute('data-tab') !== 'risk');
      document.getElementById('tab-flash').classList.toggle('hidden', t.getAttribute('data-tab') !== 'flash');
    });
  });

  // ---------- 风险数据 ----------
  var RISKS = {
    software: {
      init: [
        ['需求边界模糊，项目范围未定义', '用范围说明书+验收标准书面锁定，宁可多花一周谈清楚', 'high'],
        ['关键干系人未识别（尤其审批链上的人）', '做干系人矩阵，明确每个人关心的点和沟通频率', 'high'],
        ['预算和时间不匹配业务预期', '用类比估算+三点估算交叉验证，给出有依据的范围', 'mid']
      ],
      plan: [
        ['技术选型风险：框架/中间件能力与需求不匹配', '架构评审引入 PoC 验证，关键集成先打通 Demo', 'high'],
        ['排期过紧，未留缓冲', '至少留 15-20% 缓冲，里程碑间设置检查点', 'mid'],
        ['第三方依赖（SDK/API）能力不明', '提前锁定接口文档与联调时间窗，准备降级方案', 'mid'],
        ['人员技能缺口', '提前安排培训或引入外部支持，关键模块双人备份', 'low']
      ],
      exec: [
        ['需求变更失控', '变更控制流程：所有变更走影响评估，不评估不改代码', 'high'],
        ['开发与需求理解偏差，返工', '每迭代结束做演示验收，灰度发布尽早暴露问题', 'high'],
        ['技术债累积导致后期速度骤降', '每个迭代预留 15% 时间处理重构，静态检查卡质量门槛', 'mid'],
        ['核心开发人员离职/请假', '知识文档化+代码评审确保至少两人熟悉同一模块', 'mid']
      ],
      monitor: [
        ['进度偏差被发现太晚', '燃尽图+周报机制，偏差超 10% 立即触发纠偏', 'high'],
        ['缺陷率超出预期，测试环境与生产差异大', '引入自动化回归，测试环境配置与生产对齐', 'mid'],
        ['安全漏洞上线前才暴露', '安全扫描纳入 CI 流程，上线前做渗透测试', 'high']
      ],
      close: [
        ['验收标准扯皮，项目无法关闭', '启动时锁定的验收标准此刻是唯一依据，逐条对照签收', 'high'],
        ['文档和运维交接缺失', '收尾检查单：文档/源码/账号/监控逐项移交并签字', 'mid'],
        ['经验教训没有沉淀', '召开复盘会，输出到组织过程资产库', 'low']
      ]
    },
    rpa: {
      init: [
        ['流程选择不当：选了规则复杂或频繁变更的流程', '选流程看三个指标：规则明确、稳定性高、量大且重复', 'high'],
        ['业务方期望过高，以为"全自动"等于"不用人"', '明确自动化率目标（如 70%），例外场景由人处理', 'high'],
        ['系统权限和 IT 配合度未落实', '启动阶段就拿到系统权限与开发环境的书面承诺', 'mid']
      ],
      plan: [
        ['目标系统 UI 频繁改版', '尽量走 API/数据库集成而非界面抓取，选择器做容错', 'high'],
        ['流程文档与实际操作不一致（影子流程）', '现场观察真实操作，PDD（流程定义书）由业务签字确认', 'high'],
        ['异常场景枚举不全（弹窗、超时、数据格式异常）', '建立异常场景库，设计阶段逐条对照', 'mid'],
        ['未估算机器人并发数与许可成本', '按峰值业务量测算机器人数量，许可成本列入预算', 'mid']
      ],
      exec: [
        ['选择器脆弱，环境一变机器人就瞎', '使用锚点+通配符选择器，关键步骤加重试与截图', 'high'],
        ['测试数据污染生产数据', '测试环境隔离，机器人账号权限最小化', 'high'],
        ['业务在开发期间改了流程', '冻结期管理：开发期间流程变更走版本计划', 'mid'],
        ['机器人账号被系统安全策略锁定', '与 IT 提前约定机器人账号的白名单策略', 'mid']
      ],
      monitor: [
        ['机器人静默失败，业务中断无人知', '监控告警+失败自动通知，设置业务回补预案', 'high'],
        ['自动化率达不到验收线', '按周统计自动化率与人工处理量，及时调整范围', 'mid'],
        ['性能不达标（单量处理慢于预期）', '压测先行，必要时增加并发机器人', 'low']
      ],
      close: [
        ['运维交接缺失，机器人"没人管"', '输出运维手册：常见异常处理、日志位置、重启步骤', 'high'],
        ['业务方不会处理例外场景', '培训+操作手册，例外场景演练至少一轮', 'mid'],
        ['收益无法量化，项目价值被质疑', '上线前记录人工基线工时，上线后对比输出效益报告', 'mid']
      ]
    },
    infra: {
      init: [
        ['用地/许可等前置条件未落实就启动', '把外部审批列为关键路径，提前启动并定期跟踪', 'high'],
        ['总投资估算缺乏依据，后期大幅超支', '参考历史项目+分项估算，设置管理储备', 'high']
      ],
      plan: [
        ['地质/气候等现场条件不明', '勘察先行，风险储备金覆盖不可预见费', 'high'],
        ['供应链（大宗材料）价格波动', '锁价采购或合同约定调价公式', 'mid']
      ],
      exec: [
        ['安全事故', '安全检查制度化，隐患台账闭环管理', 'high'],
        ['分包商能力不达标或挂靠', '分包资质审查+进场验收+过程考核', 'high'],
        ['工期延误层层传导', '关键路径监控，延误 7 天内启动赶工/快速跟进决策', 'mid']
      ],
      monitor: [
        ['质量隐患被覆盖（隐蔽工程）', '隐蔽工程影像留存+旁站监理+验收签认', 'high'],
        ['投资偏差失控', '月度挣值分析，偏差超阈值上报决策', 'mid']
      ],
      close: [
        ['竣工资料不全无法验收', '资料与施工同步整理，不搞"最后补资料"', 'high'],
        ['缺陷责任期管理缺位', '明确保修清单与回访计划', 'low']
      ]
    },
    consult: {
      init: [
        ['范围蔓延：客户把咨询当"什么都做"', 'SOW 明确交付物清单与排他条款，超出即走增购', 'high'],
        ['客户一把手不支持，中层阳奉阴违', '启动会争取一把手站台，建立发起人定期沟通机制', 'high'],
        ['客户数据可获得性差', '提前发数据需求清单，约定提供责任人与时限', 'mid']
      ],
      plan: [
        ['访谈安排不下来，客户人员没时间', '访谈计划提前两周锁定，高层访谈由客户领导协调', 'mid'],
        ['行业知识储备不足', '提前做行业研究，配置带行业经验的合伙人把关', 'low']
      ],
      exec: [
        ['调研发现与客户预设结论冲突', '以事实和数据说话，提前与发起人私下对齐敏感发现', 'high'],
        ['中间汇报被全盘否定，方向推倒重来', '设置阶段确认里程碑，方向性结论先小范围吹风', 'high'],
        ['客户团队参与度低，方案落地无人接', '共创式工作坊替代单向汇报，让客户成为方案作者之一', 'mid']
      ],
      monitor: [
        ['交付物质量不稳定', '合伙人评审制：所有对外交付物过质量关', 'mid'],
        ['项目周期拉长成本失控', '周度工时盘点，超投入及时与客户沟通增补', 'mid']
      ],
      close: [
        ['成果移交后客户不会用', '交付培训+落地陪跑期（30/60/90天回访）', 'mid'],
        ['成果沉淀不足，无法复用', '项目复盘+方法论模板入库', 'low']
      ]
    }
  };

  var curType = 'software';
  var curPhase = 'init';

  function bindChips(boxId, onSel) {
    var box = document.getElementById(boxId);
    box.addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      box.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('sel'); });
      chip.classList.add('sel');
      onSel(chip.getAttribute('data-v'));
    });
  }
  bindChips('typeBox', function (v) { curType = v; });
  bindChips('phaseBox', function (v) { curPhase = v; });

  var TYPE_NAMES = { software: '软件 / IT', rpa: 'RPA / 自动化', infra: '工程 / 基建', consult: '咨询 / 实施' };
  var PHASE_NAMES = { init: '启动', plan: '规划', exec: '执行', monitor: '监控', close: '收尾' };
  var LVL_NAMES = { high: '<span class="lvl high">高</span>', mid: '<span class="lvl mid">中</span>', low: '<span class="lvl low">低</span>' };

  document.getElementById('btnGen').addEventListener('click', function () {
    var items = (RISKS[curType] && RISKS[curType][curPhase]) || [];
    if (!items.length) return;
    var html = '';
    // 按风险等级排序分组
    var order = { high: [], mid: [], low: [] };
    items.forEach(function (it) { order[it[2]].push(it); });
    ['high', 'mid', 'low'].forEach(function (lvl) {
      if (!order[lvl].length) return;
      var names = { high: '🔴 高优先级', mid: '🟠 中优先级', low: '🟢 一般关注' };
      html += '<div class="risk-group"><h3>' + names[lvl] + '</h3>';
      order[lvl].forEach(function (it) {
        html += '<label class="risk-item"><input type="checkbox" checked><div><div class="rt">' + it[0] + LVL_NAMES[it[2]] + '</div><div class="rm">应对参考：' + it[1] + '</div></div></label>';
      });
      html += '</div>';
    });
    document.getElementById('riskBody').innerHTML = html;
    document.getElementById('riskMeta').textContent = '—— ' + TYPE_NAMES[curType] + '项目 · ' + PHASE_NAMES[curPhase] + '阶段 · ' + items.length + ' 项';
    document.getElementById('riskResult').classList.remove('hidden');
    updateCheckStats();
    document.getElementById('riskBody').addEventListener('change', updateCheckStats);
    document.getElementById('riskResult').scrollIntoView({ behavior: 'smooth' });
  });

  function updateCheckStats() {
    var boxes = document.querySelectorAll('#riskBody input[type=checkbox]');
    var checked = document.querySelectorAll('#riskBody input[type=checkbox]:checked');
    document.getElementById('checkStats').textContent = '已勾选 ' + checked.length + ' / ' + boxes.length + ' 项';
  }

  document.getElementById('btnCopyRisk').addEventListener('click', function () {
    var meta = document.getElementById('riskMeta').textContent;
    var lines = ['风险检查清单' + meta, ''];
    document.querySelectorAll('#riskBody .risk-group').forEach(function (g) {
      lines.push(g.querySelector('h3').textContent);
      g.querySelectorAll('.risk-item').forEach(function (it) {
        var checked = it.querySelector('input').checked ? '[√]' : '[ ]';
        var rt = it.querySelector('.rt').textContent;
        var rm = it.querySelector('.rm').textContent;
        lines.push(checked + ' ' + rt);
        lines.push('    ' + rm);
      });
      lines.push('');
    });
    var text = lines.join('\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { alert('清单已复制'); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      alert('清单已复制');
    }
  });

  // ---------- 考点速记卡 ----------
  var CARDS = [
    { cat: 'framework', q: '五大过程组是哪五个？各是什么定位？', a: '启动（授权项目/阶段开始）、规划（定路线）、执行（做交付）、监控（量偏差+纠偏）、收尾（正式关闭+沉淀）。口诀：启规执监收。监控贯穿全过程，不是只在一个阶段。' },
    { cat: 'framework', q: '项目管理三大基准是什么？', a: '范围基准（范围说明书+WBS+字典）、进度基准、成本基准。基准一经批准就受控，变更必须走变更控制流程，基准"三兄弟"是绩效考核的依据。' },
    { cat: 'framework', q: 'WBS 分解到什么程度算合适？', a: '分解到工作包——可估算、可分配、可检查的最小单元，遵循 8/80 原则（一个工作包工作量不超过 80 小时、不少于 8 小时）。WBS 是范围基准的核心，100% 原则：下层之和=上层全部工作。' },
    { cat: 'risk', q: '消极风险（威胁）的应对策略有哪些？', a: '规避（消除原因，改计划绕开）、转移（转给第三方，买保险/外包/担保）、减轻（降低概率或影响，加测试/冗余）、接受（主动接受设应急储备，或被动接受不作为）。' },
    { cat: 'risk', q: '积极风险（机会）的应对策略有哪些？', a: '开拓（确保机会一定发生）、分享（拉伙伴一起抓住，如合资）、提高（放大概率或影响）、接受（不主动追求，顺其自然）。' },
    { cat: 'risk', q: '已知风险和未知风险分别用什么储备？', a: '已知-已知风险 → 应急储备（Contingency Reserve，项目经理可动用）；未知风险（未知-未知）→ 管理储备（Management Reserve，需要变更流程动用，不在成本基准内但总预算含它）。' },
    { cat: 'evm', q: '挣值的三个基本值是什么？', a: 'PV（计划价值）：截止当前计划该完成多少工作值多少钱；EV（挣值）：实际完成了多少计划工作值多少钱；AC（实际成本）：实际花了多少钱。EV 衡量"完成量"，用计划价格折算。' },
    { cat: 'evm', q: 'CV、SV、CPI、SPI 怎么算？大于/小于 1 或 0 各代表什么？', a: 'CV=EV-AC（<0 超支）；SV=EV-PV（<0 落后）；CPI=EV/AC（<1 花一块钱只干出不到一块钱的活，成本超支）；SPI=EV/PV（<1 进度落后）。记忆：减法看差值，除法看比率，E 在前是"挣"的标准。' },
    { cat: 'evm', q: '完工估算 EAC 和完工尚需估算 ETC 怎么理解？', a: '典型偏差持续时 EAC=BAC/CPI（按当前花钱效率干到底）；进度影响另算时 EAC=AC+(BAC-EV)；ETC=EAC-AC（还差多少钱干完）。TCPI=(BAC-EV)/(BAC-AC)：剩余工作每块钱要干出多少挣值才能达标。' },
    { cat: 'procure', q: '固定总价合同（FFP）适合什么场景？风险谁担？', a: '范围明确、设计成熟时用。卖方（乙方）担成本风险——超支自己扛，所以乙方报价会加风险溢价。买方最省心但通常买贵。变更要严控，因为每次变更都是新谈判。' },
    { cat: 'procure', q: '成本补偿合同有哪几种？什么时候用？', a: 'CPPF 成本+固定费用、CPIF 成本+激励（省了分成/超了分担，最常用）、CPAF 成本+奖励。适合范围说不清的研发/抢险类项目。买方担成本风险，所以要盯着卖方的账。' },
    { cat: 'procure', q: '工料合同（T&M）什么时候用？', a: '范围小、需要快速签约、或雇"按小时计费的专业人员"时用。单价固定、总价随工作量浮动，双方风险均摊。适合短期支持类采购，不适合大项目（总价不可控）。' },
    { cat: 'soft', q: '干系人太多管不过来怎么办？', a: '干系人按"权力-利益"方格分类：高权高利→重点管理（紧密沟通）；高权低利→令其满意；低权高利→随时告知；低权低利→监督即可。策略是差异化沟通，不是人人平等对待。' },
    { cat: 'soft', q: '冲突解决的五种方式，哪种最好？', a: '合作/解决问题（Win-Win，直面冲突找根因，最好）；妥协/调解（各让一步）；缓和/包容（求同存异）；强迫/命令（输赢，紧急时用）；撤退/回避（暂时搁置，最差但有时先降温）。情境决定选择，考试里"合作"多为正确答案。' },
    { cat: 'soft', q: '项目经理的权力来源有哪些？哪个最持久？', a: '正式权力（职位）、奖励权力、惩罚权力（强制）、专家权力（专业能力）、参照权力（个人魅力）。职位权力随岗位消失；专家权力和参照权力最持久——考 PMP 后真正拉开差距的是这两个。' }
  ];

  var catFilter = 'all';
  var deck = CARDS.slice();
  var idx = 0;
  var flipped = false;

  function renderDeck() {
    deck = CARDS.filter(function (c) { return catFilter === 'all' || c.cat === catFilter; }).slice();
    // 打乱
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    idx = 0;
    showCard();
  }

  function showCard() {
    if (!deck.length) {
      document.getElementById('fQ').textContent = '该类别暂无卡片';
      document.getElementById('fCat').textContent = '';
      document.getElementById('fA').classList.add('hidden');
      document.getElementById('fTap').textContent = '';
      document.getElementById('fCount').textContent = '';
      return;
    }
    if (idx >= deck.length) idx = 0;
    if (idx < 0) idx = deck.length - 1;
    var c = deck[idx];
    var CAT_NAMES = { framework: '五大过程组 / 框架', risk: '风险应对', evm: '挣值管理', procure: '合同类型', soft: '软技能' };
    document.getElementById('fCat').textContent = CAT_NAMES[c.cat] || c.cat;
    document.getElementById('fQ').textContent = c.q;
    document.getElementById('fA').textContent = c.a;
    flipped = false;
    document.getElementById('fA').classList.add('hidden');
    document.getElementById('fTap').textContent = '点击卡片查看答案';
    document.getElementById('fCount').textContent = (idx + 1) + ' / ' + deck.length;
  }

  document.getElementById('flashCard').addEventListener('click', function () {
    if (!deck.length) return;
    flipped = !flipped;
    document.getElementById('fA').classList.toggle('hidden', !flipped);
    document.getElementById('fTap').textContent = flipped ? '点击卡片翻回问题' : '点击卡片查看答案';
  });
  document.getElementById('fPrev').addEventListener('click', function () { idx--; showCard(); });
  document.getElementById('fNext').addEventListener('click', function () { idx++; showCard(); });
  document.getElementById('fShuffle').addEventListener('click', renderDeck);

  document.getElementById('catBox').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    this.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('sel'); });
    chip.classList.add('sel');
    catFilter = chip.getAttribute('data-v');
    renderDeck();
  });

  renderDeck();
})();
</script>
</body>
</html>
